# Build and publish the site on every push to main.
#
# This exists because deploying from a laptop needs credentials that laptop may
# not have. GitHub already trusts itself: the built-in GITHUB_TOKEN can push to
# gh-pages, so a deploy costs one push to main and nothing else.
#
# The engine test suites gate the deploy. If tests/sanity.mjs stops printing
# 1665 / 15 / 522 / 1687, nothing is published.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm ci

      - name: Engine calibration and test suites
        run: |
          node tests/sanity.mjs
          node tests/telemetry.mjs
          node tests/tradespace.mjs
          node tests/outpost.mjs
          node tests/difficulty.mjs
          node tests/session.mjs
          node tests/missionfile.mjs
          node tests/architectx.mjs

      - name: Build
        run: npm run build

      - name: Publish to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA:0:7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
